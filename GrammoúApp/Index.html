<!DOCTYPE html>
<html lang="es">

<head>
    <title>Grammoù</title>
    <meta charset="UTF-8">
    <link rel="icon" type="image/x-icon" href="./Imagenes/Icono_APP.ico">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="./Grammoú/style.css">
</head>

<body>
    <header class="navbar navbar-expand-lg navbar-light py-3 mb-4">
        <div class="container d-flex justify-content-between align-items-center">
            <span class="h3 mb-0 fw-bold text-uclm">UCLM</span>
            <h1 class="h2 mb-0 fw-bold text-grammou">GRAMMOÙ</h1>
            <div>
                <img src="./Imagenes/Icono_APP.webp" alt="Logo de la UCLM" class="logo-img">
            </div>
        </div>
    </header>

    <main class="container my-5 flex-grow-1 d-flex align-items-center">
        <div class="row justify-content-center g-5 w-100">
            <div class="col-md-5">
                <div class="card card-prof p-4 h-100 text-center">
                    <div class="card-body d-flex flex-column align-items-center">
                        <i class="bi bi-person-circle mb-3" style="font-size: 5rem; color: var(--french-blue);"></i>
                        <h2 class="h4 mb-4 fw-bold text-uclm">Login</h2>
                        
                        <form class="w-100 text-start" action="Mapa.html">
                            <div class="mb-3">
                                <label for="prof-usuario" class="form-label text-muted">Usuario / Correo</label>
                                <input type="text" class="form-control" id="prof-usuario" placeholder="Adam10/@ejemplo.com" required>
                            </div>

                            <div class="mb-4">
                                <label for="prof-pass" class="form-label text-muted">Contraseña</label>
                                <input type="password" class="form-control" id="prof-pass" placeholder="mínimo 8 caracteres" required>
                            </div>

                            <div class="btn-gradient-container mb-2">
                                <button type="submit" class="custom-btn btn-prof-style">Acceder</button>
                            </div>
                        </form>

                        <div class="mt-4 registration-link">
                            <p class="mb-1 text-muted small">¿No tienes una cuenta?</p>
                            <a href="Registro.html" class="fw-bold text-decoration-none text-grammou">Regístrate aquí</a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <footer class="footer-institucional py-4 mt-auto">
        <div class="container">
            <div class="row align-items-center text-center text-md-start">
                <div class="col-12 col-md-6 d-flex justify-content-center justify-content-md-start gap-4 mb-4 mb-md-0">
                    <a href="https://educacion.castillalamancha.es/" class="footer-link">Protección de datos</a>
                    <a href="https://educacion.castillalamancha.es/" class="footer-link">Aviso Legal</a>
                    <a href="https://www.castillalamancha.es/declaraci%C3%B3n-de-accesibilidad" class="footer-link">Accesibilidad</a>
                </div>

                <div class="col-12 col-md-6 d-flex justify-content-center justify-content-md-end align-items-center gap-4">
                    <div class="d-flex align-items-center gap-2 logo-container">
                        <img src="https://upload.wikimedia.org/wikipedia/commons/b/b7/Flag_of_Europe.svg" alt="Bandera Unión Europea" style="width: 50px;">
                        <div class="text-start footer-txt-small">
                            <strong class="d-block">UNIÓN EUROPEA</strong>
                            <span>Fondo Europeo de Desarrollo Regional</span>
                        </div>
                    </div>
                    <div class="logo-container">
                        <img src="./Imagenes/logo-castilla-la-mancha.webp" alt="Castilla-La Mancha" style="height: 45px;">
                    </div>
                </div>
            </div>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="./Grammoú/login.js"></script>
</body>
</html>
