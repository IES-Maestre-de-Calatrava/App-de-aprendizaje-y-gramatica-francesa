<!DOCTYPE html>
<html lang="es">

<head>
    <title>Grammoù</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="./Grammoú/style.css">
</head>

<body>
    <header class="navbar navbar-expand-lg navbar-light py-3 mb-4">
        <div class="container d-flex justify-content-between align-items-center">
            <span class="h3 mb-0 fw-bold text-uclm">UCLM</span>
            <h1 class="h2 mb-0 fw-bold text-grammou">GRAMMOÚ</h1>
            <div>
                <img src="/Imagenes/Logo-UCLM.webp" alt="Logo de la UCLM" class="logo-img">
            </div>
        </div>
    </header>
    <main class="container my-5 flex-grow-1 d-flex align-items-center">
        <div class="row justify-content-center g-5 w-100">
            <div class="col-md-5">
                <div class="card card-prof p-4 h-100 text-center">
                    <div class="card-body d-flex flex-column align-items-center">
                        <i class="bi bi-person-circle mb-3" style="font-size: 5rem; color: var(--french-blue);"></i>
                        <h2 class="h4 mb-4 fw-bold text-uclm">Profesor</h2>
                        <form class="w-100 text-start">
                            <div class="mb-3">
                                <label for="prof-usuario" class="form-label text-muted">Usuario / Correo</label>
                                <input type="text" class="form-control" id="prof-usuario" placeholder="Usuario / Correo"
                                    required>
                            </div>

                            <div class="mb-4">
                                <label for="prof-pass" class="form-label text-muted">Contraseña</label>
                                <input type="password" class="form-control" id="prof-pass" placeholder="Contraseña"
                                    required>
                            </div>

                            <div class="btn-gradient-container mb-2">
                                <button type="submit" class="custom-btn btn-prof-style">Entrar</button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>

            <div class="col-md-5">
                <div class="card card-alum p-4 h-100 text-center">
                    <div class="card-body d-flex flex-column align-items-center">
                        <i class="bi bi-person-circle mb-3" style="font-size: 5rem; color: var(--french-red);"></i>
                        <h2 class="h4 mb-4 fw-bold text-danger" style="color: var(--french-red) !important;">Alumno</h2>

                        <form class="w-100 text-start">
                            <div class="mb-3">
                                <label for="alum-usuario" class="form-label text-muted">Usuario / Correo</label>
                                <input type="text" class="form-control" id="alum-usuario" placeholder="Usuario / Correo"
                                    required>
                            </div>
                            <div class="mb-4">
                                <label for="alum-pass" class="form-label text-muted">Contraseña</label>
                                <input type="password" class="form-control" id="alum-pass" placeholder="Contraseña"
                                    required>
                            </div>

                            <div class="btn-gradient-container mb-2">
                                <button type="submit" class="custom-btn btn-alum-style">Entrar</button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <footer class="text-center py-3">
        <p class="mb-0">&copy; 2026 GRAMMOÚ - UCLM. Todos los derechos reservados.</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>

</html>
